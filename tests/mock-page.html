<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToneShift E2E Test Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }
    h2 { margin-bottom: 12px; color: #333; font-size: 16px; }

    /* Twitter/X 風 */
    .tweet-box {
      background: white;
      border: 1.5px solid #cfd9de;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .tweet-input {
      width: 100%;
      min-height: 80px;
      outline: none;
      font-size: 15px;
      color: #0f1419;
      caret-color: #1d9bf0;
    }
    .tweet-input:empty::before {
      content: "What's happening?";
      color: #aab8c2;
    }

    /* Gmail 風 */
    .gmail-box {
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 24px;
    }
    .gmail-input {
      width: 100%;
      min-height: 100px;
      outline: none;
      font-size: 14px;
      color: #202124;
    }
    .gmail-input:empty::before {
      content: "Compose your email here...";
      color: #bbb;
    }

    #status {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #1a1a2e;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      max-width: 400px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h2>Twitter/X 風 入力エリア</h2>
  <div class="tweet-box">
    <div
      id="tweet-input"
      class="tweet-input"
      contenteditable="true"
      role="textbox"
      data-testid="tweetTextarea_0"
      aria-label="Tweet text"
    ></div>
  </div>

  <h2>Gmail 風 入力エリア</h2>
  <div class="gmail-box">
    <div
      id="gmail-input"
      class="gmail-input Am Al editable"
      contenteditable="true"
      role="textbox"
      aria-label="Email body"
    ></div>
  </div>

  <div id="status">Test page ready</div>

  <script>
    // テスト結果の記録用
    window.__testResults = {};

    // 入力エリアのイベントを記録
    document.querySelectorAll('[contenteditable]').forEach(el => {
      el.addEventListener('focus', () => {
        document.getElementById('status').textContent = 'focused: ' + (el.id || el.dataset.testid);
      });
    });

    // ToneShiftがロードされたか監視
    const observer = new MutationObserver(() => {
      const host = document.getElementById('__tonshift_host__');
      if (host) {
        window.__testResults.extensionLoaded = true;
        document.getElementById('status').textContent = '✅ ToneShift loaded';
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true });
  </script>
</body>
</html>
